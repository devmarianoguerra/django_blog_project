{% extends 'posts/base.html' %} {% block content %} {% for post in posts %}
<article>
	<h1>{{ post.titulo }}</h1>
	<p>{{ post.contenido }}</p>
	<p>Autor: {{ post.autor }}</p>
	<p>Estado: {{ post.estado }}</p>
	<p>Fecha de creación: {{ post.fecha_creacion }}</p>
</article>
{% endfor %} {% endblock %}
