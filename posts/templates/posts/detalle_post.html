{% extends 'posts/base.html' %} {% block content %}
<article>
	{% if post.imagen %}
	<img src="{{ post.imagen.url }}" alt="{{ post.titulo }}" />
	{% endif %}
	<h1>{{ post.titulo }}</h1>
	<p>{{ post.contenido }}</p>
	<p>Autor: {{ post.autor }}</p>
	<p>Estado: {{ post.estado }}</p>
	<p>Fecha de creación: {{ post.fecha_creacion }}</p>
	<a href="{% url 'editar_post' post.pk %}">Editar</a>
	<a href="{% url 'eliminar_post' post.pk %}">Eliminar</a>
</article>
{% endblock %}
