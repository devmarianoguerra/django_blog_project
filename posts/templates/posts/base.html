{% load static %}
<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Blog Django</title>
		<link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}" />
	</head>
	<body>
		<header>
			<nav>
				<a href="{% url 'inicio' %}">Inicio</a>
				<a href="{% url 'lista_posts' %}">Posts</a>
				<a href="{% url 'acerca' %}">Acerca de</a>
				{% if user.is_authenticated %} Hola, {{ user.username }}
				<a href="{% url 'perfil' %}">Mi perfil</a>
				<a href="{% url 'crear_post' %}">Crear post</a>
				<form method="post" action="{% url 'logout' %}">
					{% csrf_token %}
					<button type="submit">Cerrar sesión</button>
				</form>
				{% else %}
				<a href="{% url 'login' %}">Iniciar sesión</a>
				<a href="{% url 'registro' %}">Registrarse</a>
				{% endif %}
			</nav>
		</header>

		<main>{% block content %}{% endblock %}</main>
	</body>
</html>
